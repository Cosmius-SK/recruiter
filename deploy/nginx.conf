# nginx: serves the product website at / and fronts the API at /api/
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Product website (static) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Workflow control plane ---
    # /api/workflows... -> api:8000/workflows...
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Workflow runs block until the next human gate; allow long requests.
        proxy_read_timeout 900s;
    }
}
