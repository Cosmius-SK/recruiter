# Hire on a single VM: nginx serves the product website and fronts the API.
#   1. cp .env.example .env   (add GOOGLE_API_KEY or ANTHROPIC_API_KEY)
#   2. docker compose up -d --build
#   The stack listens on 127.0.0.1:8080; put the host's nginx in front of it on
#   443 with a trusted cert (deploy/nginx-host-hire.conf.example). See deploy/gcp.md.
services:
  api:
    build: .
    env_file: .env
    environment:
      TALENTFLOW_CHECKPOINT_DB: /data/talentflow_checkpoints.sqlite
    volumes:
      - talentflow-data:/data
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      # Bind to localhost only: the host's own nginx fronts this on 443 with a
      # trusted cert. Nothing is exposed publicly on :8080, and the existing app
      # keeps 80/443. (Use "8080:80" instead for direct, certless VM-IP access.)
      - "127.0.0.1:8080:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  talentflow-data:
