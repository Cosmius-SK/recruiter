[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentflow"
version = "0.1.0"
description = "TalentFlow — an autonomous, human-governed recruitment-lifecycle orchestrator built on LangGraph + Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
talentflow-demo = "talentflow.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
